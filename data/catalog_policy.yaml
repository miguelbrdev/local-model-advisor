version: "1.1.0"
description: >
  Local policy that defines which canIRun.ai categories map to internal
  tasks, which tags are informational, and minimum validity rules for
  importing external model records.

source:
  endpoint: "https://canirun.ai/api/models"
  sync_interval_days: 21

# Mapping from external useCase tags to internal task identifiers.
# Keys are external tags, values are lists of internal tasks.
# A model qualifies for a task if ANY of its useCase tags match a key.
use_case_mapping:
  chat:
    - chat
  code:
    - codigo
  reasoning:
    - razonamiento

# Tags that are preserved as informational metadata but do not
# map to any internal task.
informational_tags:
  - multilingual
  - edge
  - rag

# useCase tags that are out of scope for v1.
# Models whose useCase contains ONLY these tags are excluded.
out_of_scope_tags:
  - vision
  - image
  - video
  - embeddings
  - rerankers

# Enrichment of included families with languages and runtimes, run inside
# the synchronisation after normalisation (never during a request).
# Sources approved on 2026-11-08: the canIRun.ai detail endpoint and the
# public Hugging Face model API (card metadata + quantised-derivative tree).
# Per-family failures never exclude a model; the snapshot records counts.
enrichment:
  enabled: true
  canirun_detail_endpoint: "https://canirun.ai/api/models/{id}"
  huggingface_api: "https://huggingface.co/api/models"
  # canIRun detail fields that name the model in a runtime's own library.
  runtime_by_canirun_field:
    ollamaId: ollama
    lmStudioId: lmstudio
  # Format tag (Hugging Face) -> runtimes that load it. GGUF implies
  # llama.cpp and LM Studio (which loads any GGUF); Ollama only through
  # its own library (ollamaId), since importing a GGUF is a manual step.
  runtime_by_format:
    gguf: [llama.cpp, lmstudio]
    mlx: [mlx]
    safetensors: []
    transformers: [transformers]
    awq: [vllm]
    gptq: [vllm]
    fp8: [vllm]
    compressed-tensors: [vllm]
    exl2: [exllama]
    exl3: [exllama]
    onnx: [onnxruntime]
    openvino: [openvino]

# Minimum validity rules for a record to be importable.
validity_rules:
  require_non_empty_id: true
  require_unique_id: true
  require_at_least_one_supported_task: true

# Extension point for future license classification.
# Not enforced in v1 — placeholder for documentation and testing.
license_policy:
  commercial_allowed: []
  commercial_restricted: []
  unknown: []
