# Reviewed mapping: catalogue family (canirun_id) -> exact model names in the
# approved benchmark sources.  This file is the ONLY bridge between the
# catalogue and the benchmark data: the sync never guesses a name, and a
# family that is not listed here (or whose pinned name is absent from the
# downloaded data) simply gets no score, which the scorer treats as neutral.
#
# Fields per family (all optional):
#   epoch_model_version      "Model version" in Epoch AI's per-benchmark CSVs
#                            (gpqa_diamond, math_level_5, swe_bench_verified).
#                            Suffix _none = run without reasoning; _low/_medium/
#                            _high/_max/_minimal = reasoning effort of the run.
#                            The pinned name is the default or highest-effort run
#                            of the exact open checkpoint in the catalogue.
#   epoch_eci_model          "Model" in epoch_capabilities_index/eci_scores.csv
#                            (Epoch Capabilities Index, general capability).
#   artificial_analysis_slug "slug" in the Artificial Analysis Data API; only
#                            models whose free-tier Intelligence Index is not
#                            null are worth pinning.
#   nota                     reviewer remark (why a name was chosen or left out).
#
# Rules followed when reviewing (2026-11-08, data of the same day):
#   * Same checkpoint only: no base/instruct swaps, no other size, no newer
#     revision (e.g. our deepseek-v4-flash is the April release, so the July
#     "0731" rows are NOT used; Granite 4.1 is not Granite 4.2).
#   * API-only aliases ("deepseek-chat", "qwen3.5-plus") are never used.
#   * Reasoning effort: the default run of the model (thinking enabled where the
#     model supports it) or, when only effort-suffixed rows exist, the highest
#     effort, which is what a local user gets with reasoning on.
#   * Mirrors: lmstudio-community GGUF repos are the same weights as the
#     upstream model, so the upstream row is used.
#
# Measured coverage against snap-176d40242fd0157a: 46 of 91 families get at
# least one Epoch AI score; 8 get an Artificial Analysis index.
