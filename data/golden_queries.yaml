# Golden queries: reviewed expectations for the deterministic pipeline.
#
# Each case is what a client would send plus what a reviewer expects from the
# catalogue snapshot named below, evaluated with the offline parameter-count
# VRAM heuristic (src/compatibility/heuristica.py), never with live
# canirun.ai answers. Expectations pin *defensible* properties (fits / does
# not fit, task and licence filtering, obvious strong candidates) rather than
# the exact order, which may legitimately move when weights are tuned.
#
# Run: python -m scripts.evaluate_golden
version: "1.0.0"
snapshot_id: "snap-176d40242fd0157a"
descripcion: >
  First suite, written against the bootstrap snapshot. Covers the three v1
  tasks, VRAM budgets from 1 GB to 48 GB, the commercial-licence filter and
  the empty-result case.

casos:
  - id: codigo-8gb
    descripcion: Mid-range GPU for coding; both Qwen coders fit, large coders must not.
    criterios: {tarea: codigo, vram_gb: 8}
    top_n: 3
    debe_incluir: [qwen2.5-coder-7b, qwen2.5-coder-1.5b]
    debe_excluir: [qwen3-coder-30b, devstral-small-2-24b, qwen3-coder-480b]
    min_candidatos: 5

  - id: codigo-24gb-comercial
    descripcion: Commercial use excludes Llama/GLM licences; Devstral fits and ranks high.
    criterios: {tarea: codigo, vram_gb: 24, requiere_licencia_comercial: true}
    top_n: 8
    debe_incluir: [devstral-small-2-24b, qwen2.5-coder-7b]
    debe_excluir: [llama3.2-3b, llama3.1-8b, glm-4-9b, llama3.3-70b]
    min_candidatos: 10

  - id: codigo-48gb
    descripcion: Large GPU surfaces the strong 24B-30B coders; 80B+ MoE still does not fit.
    criterios: {tarea: codigo, vram_gb: 48}
    top_n: 5
    debe_incluir: [qwen3-coder-30b, devstral-small-2-24b]
    debe_excluir: [qwen3-coder-480b, qwen3-next-80b-a3b, qwen3-coder-next-80b-a3b]
    min_candidatos: 20

  - id: chat-6gb
    descripcion: Entry-level GPU; small Qwen chat models lead, 12B+ and dedicated coders are out.
    criterios: {tarea: chat, vram_gb: 6}
    top_n: 5
    debe_incluir: [qwen3-0.6b, qwen3-1.7b]
    debe_excluir: [gemma3-12b, mistral-nemo-12b, qwen3-14b, qwen2.5-coder-7b]
    min_candidatos: 10

  - id: chat-12gb-comercial
    descripcion: Gemma, Llama and MRL licences are not permissive; Apache Qwen 4B stays.
    criterios: {tarea: chat, vram_gb: 12, requiere_licencia_comercial: true}
    top_n: 8
    debe_incluir: [qwen3.5-4b]
    debe_excluir: [gemma3-4b, gemma4-e2b-it, llama3.2-1b, ministral-8b]
    min_candidatos: 10

  - id: razonamiento-16gb
    descripcion: DeepSeek R1 distils fit; the 32B distil and the 671B original do not; coders are out.
    criterios: {tarea: razonamiento, vram_gb: 16}
    top_n: 5
    debe_incluir: [deepseek-r1-7b, deepseek-r1-1.5b]
    debe_excluir: [deepseek-r1-32b, deepseek-r1, qwen2.5-coder-7b]
    min_candidatos: 10

  - id: razonamiento-4gb
    descripcion: Tiny budget; the 1.5B distil is the only dedicated reasoning model that fits comfortably.
    criterios: {tarea: razonamiento, vram_gb: 4}
    top_n: 3
    primero: deepseek-r1-1.5b
    debe_incluir: [deepseek-r1-1.5b]
    debe_excluir: [deepseek-r1-7b, phi-4-14b]
    min_candidatos: 1

  - id: chat-1gb-sin-candidatos
    descripcion: Nothing fits in 1 GB; the honest answer is an empty list, not an invented fit.
    criterios: {tarea: chat, vram_gb: 1}
    top_n: 3
    debe_excluir: [qwen3-0.6b, qwen3.5-0.8b]
    min_candidatos: 0
