# Golden queries: reviewed expectations for the deterministic pipeline.
#
# Each case is what a client would send plus what a reviewer expects from the
# catalogue snapshot named below, evaluated with the offline compatibility
# chain (src/compatibility/provider.py::proveedor_offline: the Q4_K_M row of
# the canIRun.ai quantisation table synced into the snapshot, then the
# parameter-count heuristic for families without one), never with live
# canirun.ai answers. Expectations pin *defensible* properties (fits / does
# not fit, task and licence filtering, obvious strong candidates, models that
# must no longer lead) rather than the exact order, which may legitimately
# move when weights are tuned.
#
# Ranking policy pinned since 1.1.0: "the most capable model that still fits
# comfortably" (ajuste_vram = safety margin, capacidad = use of the usable
# budget). 1.2.0 adds task-aware specialisation, recency (months behind the
# newest model, zero at 24) and context window: a dedicated coder from 2024
# no longer leads by default over a 2026 generalist of the same size, and
# dedicated reasoning models lead reasoning queries. 1.3.0 adds the measured
# capability signal (capacidad_medida, weight 0.15) from the committed
# Epoch AI benchmark bootstrap named below: among models of the same size
# and generation, the one with a measured score leads the unmeasured ones,
# and a 2024 7B model no longer has to appear in the top 8 of a 24 GB query.
# 1.4.0 switches the VRAM oracle from the parameter heuristic (0.6 GB/B + 1)
# to the canIRun.ai quantisation table, which is about 25 % lower (8B at
# Q4_K_M = 4.6 GB, not 5.8): 8B models now fit a 6 GB card comfortably, the
# 80B-A3B MoEs fit 48 GB tightly, and sub-1B models fit 1 GB, so the budgets
# and expectations below were re-reviewed against the source figures.
#
# Run: python -m scripts.evaluate_golden
version: "1.4.0"
snapshot_id: "snap-3eb98b50f1e483e0"
benchmarks_snapshot_id: "bench-9c4d458ea3be2425"
descripcion: >
  Suite written against the bootstrap snapshot and the Epoch-only benchmark
  bootstrap. Covers the three v1 tasks, VRAM budgets from 1 GB to 48 GB, the
  commercial-licence filter, the empty-result case, the "no longer
  smallest-first" policy, the recency/specialisation signals and the
  measured-capability signal.

casos:
  - id: codigo-8gb
    descripcion: >
      Mid-range GPU for coding. The newest code-capable model that fits
      comfortably (ornith-1.5-9b, 2026-08, 5.5 GB at Q4_K_M) must be in the
      top 4; the first place is not pinned because two 2026 9B-12B models
      trade places on margin versus recency. Since 1.4.0 the 2024 7B coder is
      no longer required: its measured capability is low (Epoch index 107.9,
      normalised 0.13) and it is two years old, so 2026 generalists outrank
      it. The 2024 1.5B coder must not rank. 24B+ coders (12.8 GB+) do not fit.
    criterios: {tarea: codigo, vram_gb: 8}
    top_n: 4
    debe_incluir: [ornith-1.5-9b]
    debe_quedar_fuera_del_top: [qwen2.5-coder-1.5b]
    debe_excluir: [qwen3-coder-30b, devstral-small-2-24b, qwen3-coder-480b]
    min_candidatos: 5

  - id: codigo-24gb-comercial
    descripcion: >
      Commercial use excludes Llama/GLM licences. The 24B and 30B Apache coders
      fit comfortably and must rank in the top 8, as must qwen3.8-27b, the
      Apache model with the highest measured capability (Epoch Capabilities
      Index 152.7) that fits the budget. Since 1.3.0 the 2024 7B coder is no
      longer required in the top 8: it uses a quarter of the budget and has no
      measured score, so 2026 24B-30B models legitimately outrank it.
    criterios: {tarea: codigo, vram_gb: 24, requiere_licencia_comercial: true}
    top_n: 8
    debe_incluir: [devstral-small-2-24b, qwen3-coder-30b, qwen3.8-27b]
    debe_excluir: [llama3.2-3b, llama3.1-8b, glm-4-9b, llama3.3-70b]
    min_candidatos: 10

  - id: codigo-48gb
    descripcion: >
      Large GPU surfaces the strong 24B-30B coders and the best measured 27B
      (qwen3.8-27b). Since 1.4.0 the 80B-A3B MoEs fit at Q4_K_M (41.5 GB,
      86 % of the card: a tight fit the source allows), so they are no longer
      excluded; the 120B MoE (60 GB) and the 480B coder still do not fit.
    criterios: {tarea: codigo, vram_gb: 48}
    top_n: 5
    debe_incluir: [qwen3-coder-30b, devstral-small-2-24b, qwen3.8-27b]
    debe_excluir: [qwen3-coder-480b, gpt-oss-120b]
    min_candidatos: 20

  - id: chat-6gb
    descripcion: >
      Entry-level GPU. Since 1.4.0 the source says 8B models at Q4_K_M take
      4.6 GB, 77 % of the card, so the 2026 8B chat models are the right size
      and must lead (granite-4.1-8b and gemma4-e4b-it pinned); the 0.6B/0.8B
      models still fit but must not be recommended first; 12B+ (6.6 GB+) and
      dedicated coders are out.
    criterios: {tarea: chat, vram_gb: 6}
    top_n: 5
    debe_incluir: [granite-4.1-8b, gemma4-e4b-it]
    debe_quedar_fuera_del_top: [qwen3-0.6b, qwen3.5-0.8b]
    debe_excluir: [gemma3-12b, mistral-nemo-12b, qwen3-14b, qwen2.5-coder-7b]
    min_candidatos: 10

  - id: chat-12gb-comercial
    descripcion: >
      Gemma, Llama and MRL licences are not permissive. Apache Qwen 14B (78 % of
      the budget, index 136.2) and its measured 2026 successor Qwen 3.5 9B
      (index 139.3, GPQA 0.79) must rank; the 0.6B model must not. Since 1.3.0
      the 2025 Qwen 3 8B is no longer required: its successor of the same size
      scores higher on every signal, so it sits just outside the top 8.
    criterios: {tarea: chat, vram_gb: 12, requiere_licencia_comercial: true}
    top_n: 8
    debe_incluir: [qwen3-14b, qwen3.5-9b]
    debe_quedar_fuera_del_top: [qwen3-0.6b]
    debe_excluir: [gemma3-4b, gemma4-e2b-it, llama3.2-1b, ministral-8b]
    min_candidatos: 10

  - id: razonamiento-16gb
    descripcion: >
      The dedicated 14B R1 distil (MIT, 7.7 GB = 48 % of the budget, MATH
      level 5 0.87) must stay in the top 3; the 1.5B distil must not rank; the
      32B distil and the 671B original do not fit; coders are out. It is no
      longer pinned first: since 1.4.0 the 2026 24B-A2B MoE lfm2.5-24b-a2b fits
      exactly at the comfortable threshold (12.8 GB) and, with no benchmark
      data, the VRAM capacity proxy reads it as more capable (the documented
      MoE limitation). phi-4-14b and the 7B distil are not pinned either.
    criterios: {tarea: razonamiento, vram_gb: 16}
    top_n: 3
    debe_incluir: [deepseek-r1-14b]
    debe_quedar_fuera_del_top: [deepseek-r1-1.5b]
    debe_excluir: [deepseek-r1-32b, deepseek-r1, qwen2.5-coder-7b]
    min_candidatos: 10

  - id: razonamiento-24gb-medido
    descripcion: >
      Pins the measured-capability signal. Since 1.4.0 the 35B-A3B MoEs also
      fit 24 GB comfortably (18.9 GB). The three 2026 models with Epoch scores
      (qwen3.6-35b-a3b GPQA 0.84, qwen3.8-27b index 152.7, qwen3.6-27b GPQA
      0.86) must all be in the top 5; the unmeasured 2026 models of the same
      size (agents-a1, north-mini-code, muse-glimmer, qwen3.5-27b) stay below
      them, except that a newer unmeasured one (ornith-1.5-35b-a3b, 2026-08)
      may sit between them on recency. The first place is not pinned because
      the 35B MoE and the 27B dense trade on the capacity proxy. The 671B R1
      and the 235B MoE do not fit.
    criterios: {tarea: razonamiento, vram_gb: 24}
    top_n: 5
    debe_incluir: [qwen3.6-35b-a3b, qwen3.8-27b, qwen3.6-27b]
    debe_quedar_fuera_del_top: [agents-a1, north-mini-code-1.0, muse-glimmer-30b, qwen3.5-27b]
    debe_excluir: [deepseek-r1, qwen3-235b-a22b, qwen2.5-coder-7b]
    min_candidatos: 15

  - id: razonamiento-4gb
    descripcion: >
      Tiny budget; exactly three reasoning models fit. The 1.5B distil (47 % of
      the budget) must not be first. Which 3B model leads is a margin-versus-
      dedication trade-off (smollm3 at 70 % vs phi-4-mini at 82 %) that is
      deliberately not pinned.
    criterios: {tarea: razonamiento, vram_gb: 4}
    top_n: 1
    debe_quedar_fuera_del_top: [deepseek-r1-1.5b]
    debe_excluir: [deepseek-r1-7b, phi-4-14b]
    min_candidatos: 3

  - id: chat-0.5gb-sin-candidatos
    descripcion: >
      Nothing fits in 0.5 GB (the smallest model, qwen3-0.6b, needs 0.8 GB at
      Q4_K_M); the honest answer is an empty list, not an invented fit. Since
      1.4.0 the budget is 0.5 GB because the source says the sub-1B models do
      fit 1 GB.
    criterios: {tarea: chat, vram_gb: 0.5}
    top_n: 3
    debe_excluir: [qwen3-0.6b, qwen3.5-0.8b]
    min_candidatos: 0
