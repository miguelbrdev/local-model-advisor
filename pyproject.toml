[project]
name = "local-model-advisor"
version = "0.1.0"
description = "Local API that recommends Hugging Face models by task, VRAM, language, runtime and license."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.10,<3",
    "pyyaml>=6,<7",
    "httpx>=0.28,<1",
    "langchain-core>=1,<2",
    "langchain-ollama>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
