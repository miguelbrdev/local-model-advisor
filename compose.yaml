# Local Model Advisor: API + local Ollama model.
#
#   docker compose up --build            # API on :8000, Ollama on :11434 (CPU)
#   docker compose -f compose.yaml -f compose.gpu.yaml up --build   # NVIDIA GPU
#   docker compose run --rm sync         # one catalogue synchronisation cycle
#   docker compose run --rm index        # fetch READMEs + index them in Qdrant
#   docker compose run --rm index python -m scripts.index_docs --skip-fetch   # re-index only
#
# LMA_OLLAMA_MODEL (default gemma4:e4b) and LMA_EMBEDDING_MODEL (default
# embeddinggemma) are pulled once into the ollama_models volume before the
# API starts.  Qdrant keeps the evidence index in the qdrant_storage volume.

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      # Keep the model loaded between requests: loading gemma4:e4b took ~100 s
      # on first use, later requests 4-9 s.  Ollama's default is 5 minutes.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-1h}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LMA_OLLAMA_MODEL: ${LMA_OLLAMA_MODEL:-gemma4:e4b}
      LMA_EMBEDDING_MODEL: ${LMA_EMBEDDING_MODEL:-embeddinggemma}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$$LMA_OLLAMA_MODEL\" && ollama pull \"$$LMA_EMBEDDING_MODEL\""]

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    restart: unless-stopped

  api:
    build: .
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    environment:
      LMA_OLLAMA_BASE_URL: http://ollama:11434
      LMA_OLLAMA_MODEL: ${LMA_OLLAMA_MODEL:-gemma4:e4b}
      LMA_EXTRACCION_LLM: ${LMA_EXTRACCION_LLM:-1}
      LMA_QDRANT_URL: http://qdrant:6333
      LMA_EMBEDDING_MODEL: ${LMA_EMBEDDING_MODEL:-embeddinggemma}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - runtime:/app/runtime
    restart: unless-stopped

  sync:
    build: .
    profiles: ["sync"]
    command: ["python", "-m", "scripts.sync_catalog"]
    volumes:
      - runtime:/app/runtime

  index:
    build: .
    profiles: ["index"]
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    environment:
      LMA_QDRANT_URL: http://qdrant:6333
      LMA_OLLAMA_BASE_URL: http://ollama:11434
      LMA_EMBEDDING_MODEL: ${LMA_EMBEDDING_MODEL:-embeddinggemma}
    # `docker compose run` replaces the command, so extra flags need the
    # full command: docker compose run --rm index python -m scripts.index_docs --skip-fetch
    command: ["python", "-m", "scripts.index_docs"]
    volumes:
      - runtime:/app/runtime

volumes:
  ollama_models:
  qdrant_storage:
  runtime:
